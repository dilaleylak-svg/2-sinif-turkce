<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>Türkçe Oyun Atölyesi</title><style>:root{--ink:#20304b;--navy:#233d82;--pink:#e95d8b;--green:#24a66f;--yellow:#ffd34e;--bg:#eef5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,#fff0a7 0 7%,transparent 7.2%),var(--bg);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink)}.wrap{width:min(850px,calc(100% - 24px));margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{color:#fff;background:var(--navy);text-decoration:none;border-radius:13px;padding:9px 13px;font-weight:900}.score{background:#fff;border:2px solid #cbd9eb;border-radius:14px;padding:9px 12px;font-weight:900}.panel{margin-top:18px;background:#fff;border:3px solid #cbdced;border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 11px 0 #c8d8ea}.tag{display:inline-block;background:var(--yellow);border-radius:99px;padding:7px 11px;font-weight:900}.panel h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--navy);margin:12px 0 7px}.goal{font:600 1rem/1.5 system-ui,sans-serif;background:#fff4c9;border-left:6px solid #e0b32a;border-radius:12px;padding:10px 13px}.progress{height:13px;background:#e1e9f3;border-radius:99px;overflow:hidden;margin:19px 0 7px}.bar{height:100%;background:linear-gradient(90deg,#16a2a4,#65ca70);width:0;transition:.3s}.meta{display:flex;justify-content:space-between;color:#68798b;font-weight:800}.q{text-align:center;font-size:clamp(1.35rem,4vw,2rem);font-weight:900;line-height:1.35;margin:23px 0 8px}.visual{text-align:center;font-size:clamp(2.2rem,9vw,4.7rem);min-height:92px;display:grid;place-items:center;white-space:pre-line}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.ans{min-height:62px;border:3px solid #d1deeb;background:#fff;border-radius:18px;font-size:1.08rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #d1deeb}.ans.ok{background:#dcf8e8;border-color:var(--green)}.ans.no{background:#ffe0e7;border-color:var(--pink)}.feedback{text-align:center;min-height:34px;margin:15px 0 3px;font-weight:900}.next{display:none;margin:8px auto;border:0;background:var(--navy);color:#fff;border-radius:15px;padding:12px 20px;font-weight:900}.result{text-align:center;padding:20px}.result .big{font-size:80px}.result h2{font-size:2rem}.result button{border:0;background:var(--green);color:#fff;border-radius:14px;padding:12px 18px;font-weight:900;margin:6px}@media(max-width:570px){.answers{grid-template-columns:1fr}.top{align-items:flex-start}.top a{font-size:.84rem}}</style></head><body><main class="wrap"><div class="top"><a href="index.html">← 2. Sınıf Türkçe</a><div class="score">⭐ <span id="total">0</span> puan</div></div><section class="panel"><span class="tag" id="theme"></span><h1 id="title"></h1><div class="goal" id="goal"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="meta"><span id="count"></span><span>Oyun puanı: <b id="points">0</b></span></div><div id="play"><div class="q" id="q"></div><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Sonraki →</button></div><div class="result" id="result" hidden></div></section></main><script src="data.js?v=22"></script><script>const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('g'),g=G[id]||G.alfabe;let i=0,score=0,correct=0,lock=false,total=Number(localStorage.getItem('turkce-total')||0);$('#total').textContent=total;$('#theme').textContent=g.theme;$('#title').textContent=g.icon+' '+g.title;function shuffle(items){let a=[...items];for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}const questions=shuffle(g.q).slice(0,Math.min(20,g.q.length)),taskCount=questions.length,winTarget=Math.ceil(taskCount*.8);$('#goal').textContent='🏁 Hedef: '+taskCount+' görevden en az '+winTarget+' doğru yap ve '+g.badge+' kazan.';document.title=g.title+' | 2. Sınıf Türkçe';function render(){lock=false;let x=questions[i];$('#count').textContent=`Görev ${i+1} / ${taskCount}`;$('#points').textContent=score;$('#bar').style.width=i/taskCount*100+'%';$('#q').textContent=x[0];$('#visual').textContent=x[1];$('#feedback').textContent='';$('#next').style.display='none';let o=shuffle(x[3]);$('#answers').innerHTML=o.map(()=>'<button class="ans"></button>').join('');[...$('#answers').children].forEach((b,n)=>{b.textContent=o[n];b.onclick=()=>pick(b,o[n],x[2])})}function pick(b,v,a){if(lock)return;lock=true;document.querySelectorAll('.ans').forEach(x=>{x.disabled=true;if(String(x.textContent)===String(a))x.classList.add('ok')});if(String(v)===String(a)){b.classList.add('ok');score+=10;correct++;total+=10;localStorage.setItem('turkce-total',total);$('#total').textContent=total;$('#feedback').textContent='🎉 Doğru! +10 puan'}else{b.classList.add('no');$('#feedback').textContent='💡 Doğru cevap: '+a}$('#points').textContent=score;$('#next').textContent=i===taskCount-1?'Sonucu Gör 🏆':'Sonraki Görev →';$('#next').style.display='block'}$('#next').onclick=()=>{i++;i<taskCount?render():finish()};function finish(){$('#bar').style.width='100%';$('#play').hidden=true;$('#result').hidden=false;let won=correct>=winTarget;$('#result').innerHTML=`<div class="big">${won?'🏆':'💪'}</div><div style="font-size:44px">${correct===taskCount?'⭐⭐⭐':won?'⭐⭐':'⭐'}</div><h2>${won?g.badge+' senin!':'Bir tur daha dene!'}</h2><p>${correct}/${taskCount} doğru · <b>${score} puan</b></p><button onclick="location.reload()">Tekrar Oyna</button><button onclick="location='index.html'">Oyun Kütüphanesi</button>`}render();</script></body></html>
